[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starintel-media-gen"
version = "0.1.0"
description = "Expert-routed image and video generation for StarIntel social content"
requires-python = ">=3.11"
dependencies = [
  "openai>=2",
  "google-genai>=1",
]

[project.scripts]
starintel-media = "starintel_media_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starintel_media_gen"]
