[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starintel-auto-findings"
version = "0.1.0"
description = "Read-only Auto Dig editorial candidate adapter"
requires-python = ">=3.11"
dependencies = ["starintel-doc @ git+https://github.com/lost-rob0t/starintel-doc.git@6aa8051dc7ea560943a60a25e1d600467f2778bc"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
starintel-auto-findings = "starintel_auto_findings.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starintel_auto_findings"]
